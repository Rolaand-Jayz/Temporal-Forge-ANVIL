name: Reproduction or correction
description: Reproduce a recorded result, or report an error in the record.
title: "[record] "
body:
  - type: markdown
    attributes:
      value: |
        The FSR-centered research line closed on 2026-09-15. Reports about it are used to check and correct the record. They do not reopen the closed campaign.
        ANVIL successor status is in `docs/current/STATE.md`. Evidence rules are in `docs/closure/EVALUATION_STANDARD.md`.
  - type: dropdown
    id: kind
    attributes:
      label: Report type
      options:
        - Reproduction attempt
        - Correction to the record
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - ANVIL successor
        - FSR-era record (closed)
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: Claim, file, or ledger entry
      description: Quote the claim and give its path. For the FSR era, name the row in `docs/closure/CLAIM_EVIDENCE_LEDGER.md`. For ANVIL, name the section of the qualification record or architecture document.
    validations:
      required: true
  - type: dropdown
    id: label
    attributes:
      label: Evidence label
      description: How you would classify your own report.
      options:
        - Measured fact
        - Observation
        - Inference
        - Hypothesis
        - Unresolved
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The commit SHA you built or read.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: Commands, runner controls or configuration, environment variables, input clip, and reference.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, compiler, FFmpeg version. For the historical player, also GPU, driver and Mesa version, Vulkan version, Qt version, and which FSR 4.1 RE assets were provisioned.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result
      description: What you got, compared with the recorded result. Include the run manifest or hashes if the ANVIL runner produced them. For the historical player, name the backend that actually ran according to runtime diagnostics, not the one requested.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Competing explanations
      description: What else could explain the difference.
  - type: markdown
    attributes:
      value: |
        Do not attach FSR weight blobs, native pack data, or other reverse-engineering-derived files. See `PROVENANCE.md`.
