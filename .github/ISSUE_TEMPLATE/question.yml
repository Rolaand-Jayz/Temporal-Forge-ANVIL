name: Question
description: Ask about the code, the evidence, or the project's state.
title: "[question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Start with `docs/README.md`, `docs/current/STATE.md`, and `docs/closure/README.md`.
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Files or documents involved
      description: Paths you have already read, if any.
