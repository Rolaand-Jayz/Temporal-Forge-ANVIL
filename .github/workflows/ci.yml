name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-ctest:
    name: Arch build + CTest
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: Install build dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          git
          base-devel
          cmake
          ninja
          pkgconf
          qt6-base
          qt6-declarative
          qt6-shadertools
          vulkan-headers
          vulkan-icd-loader
          ffmpeg
          glslang
          python
          python-pytest

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          # Baseline immutability tests require the fixed original commit object,
          # which is older than this PR head. A shallow head-only checkout
          # incorrectly fails the pinned-commit presence check.
          fetch-depth: 0
          # pull_request defaults to refs/pull/<n>/merge. Build-Ready
          # provenance must validate the literal PR branch head instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # The Arch job runs inside a container while the mounted checkout is
      # owned by the host runner. Git otherwise rejects it as dubious
      # ownership, which made both build-time provenance and the mandatory
      # rebuild regression see "not a git checkout".
      - name: Trust checkout for Git provenance
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify branch-head checkout
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: CTest
        run: ctest --test-dir build --output-on-failure

      # Mandatory Build-Ready evidence. CTest keeps this regression skippable
      # on generic developer hosts; in CI, exit 77 is a visible job failure.
      - name: Required ANVIL provenance rebuild regression
        run: |
          TMPDIR="$(dirname "$GITHUB_WORKSPACE")" \
            python3 tests/anvil_provenance_rebuild_regression.py "$GITHUB_WORKSPACE"

  python-contracts:
    name: Python contract suite
    runs-on: ubuntu-24.04
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
          # Check the literal PR head rather than GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate Visual Review Lab JavaScript syntax and findings export
        run: |
          node --check tools/anvil_lab/web/lab.js
          node --test tests/anvil_lab_findings_export.test.cjs

      - name: Verify branch-head checkout
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest ffmpeg pkg-config libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libva-dev libdrm-dev

      # The ANVIL targets need only FFmpeg. The historical player requires
      # Qt6 >= 6.6, which ubuntu-24.04 apt does not provide, so the full
      # CMake configure cannot run here (the Arch build job covers that
      # path, including the ANVIL CTest targets). Compile the runner
      # directly from the same sources instead.
      - name: Build anvil_runner (ANVIL contract binary)
        run: |
          mkdir -p build-py
          GIT_SHA="$(git rev-parse HEAD)"
          if [ -n "$(git status --porcelain)" ]; then GIT_DIRTY=true; else GIT_DIRTY=false; fi
          g++ -std=c++23 -O2 -Isrc \
            -DANVIL_BUILD_TYPE="\"g++-direct\"" \
            -DANVIL_COMPILER_ID="\"g++ $(g++ -dumpversion)\"" \
            -DANVIL_GIT_SHA="\"$GIT_SHA\"" \
            -DANVIL_GIT_DIRTY="\"$GIT_DIRTY\"" \
            tools/anvil/main.cpp \
            src/anvil/*.cpp \
            src/media/Demuxer.cpp src/media/VideoDecoder.cpp src/util/Log.cpp \
            $(pkg-config --cflags --libs libavformat libavcodec libavutil libswscale) \
            -pthread -o build-py/anvil_runner
          # Fine-timebase fixture generator for the tick-collision
          # regression: the ffmpeg-CLI fixture route is version-sensitive
          # (hangs ~10 min on ubuntu-24.04's ffmpeg 6.1), so the python
          # suite consumes the libavformat tool instead.
          g++ -std=c++23 -O2 tools/anvil/make_tick_fixture.cpp \
            $(pkg-config --cflags --libs libavformat libavcodec libavutil) \
            -o build-py/make_tick_fixture
          # ANVIL Lab (Home Field Exhibition + Visual Review Lab): FFmpeg-free,
          # needs only the vendored stb header + anvil's SHA-256.
          g++ -std=c++23 -O2 -Isrc -Iexternal/stb \
            tools/anvil_lab/exhibit_main.cpp src/anvil_lab/*.cpp src/anvil/Sha256.cpp \
            -pthread -o build-py/anvil_exhibit
          g++ -std=c++23 -O2 -Isrc -Iexternal/stb \
            tools/anvil_lab/server_main.cpp src/anvil_lab/*.cpp src/anvil/Sha256.cpp \
            -pthread -o build-py/anvil_review_lab
          ./build-py/anvil_runner --help > /dev/null

      - name: Run historical + ANVIL contract suites
        run: |
          python3 -m pytest -q \
            tests/test_all_candidate_matrix.py \
            tests/test_method_identity.py \
            tests/test_harness_capture_contract.py \
            tests/test_temporal_matrix.py \
            tests/test_quality_runner_contract.py \
            tests/test_event_trace_assembly.py \
            tests/test_anvil_contract.py \
            tests/test_anvil_lab_contract.py
        env:
          ANVIL_RUNNER: ${{ github.workspace }}/build-py/anvil_runner
          ANVIL_MAKE_TICK_FIXTURE: ${{ github.workspace }}/build-py/make_tick_fixture
          ANVIL_EXHIBIT: ${{ github.workspace }}/build-py/anvil_exhibit
          ANVIL_REVIEW_LAB: ${{ github.workspace }}/build-py/anvil_review_lab
